[audio]
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.59999998658895493
    center = [ "weather", "Spacer1", "workspaces", "Spacer1", "group:g1" ]
    end = [ "audio_visualizer", "media", "tray", "Spacer", "date", "control-center", "clock", "notifications" ]
    font_family = "Adwaita Sans"
    font_weight = 600
    radius = 10
    shadow = false
    start = [ "group:g2" ]
    thickness = 24

        [[bar.default.capsule_group]]
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "network", "keyboard_layout" ]
        opacity = 1.0
        padding = 6.0

        [[bar.default.capsule_group]]
        border = ""
        enabled = true
        fill = "#373747"
        id = "g2"
        members = [ "recorder", "wallhaven", "power_profile" ]
        opacity = 1.0
        padding = 6.0

