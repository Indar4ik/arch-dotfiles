[plugin_settings."noctalia/screen_recorder"]
audio_source = "both"
directory = "~/Видео/Records"
frame_rate = 100
quality = "medium"
video_codec = "av1"

[plugins]
enabled = [
    "noctalia/bongocat",
    "noctalia/kaomoji",
    "noctalia/notes",
    "noctalia/timer",
    "noctalia/wallhaven",
    "noctalia/screen_recorder"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
app_icon_color = "on_surface"
avatar_path = "/home/indar4ik/face.png"
clipboard_history_max_entries = 512
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.launcher.providers.calculator]
    prefix = "calc"

    [shell.launcher.providers.emoji]
    prefix = "emo"

    [shell.launcher.providers.wallpaper]
    prefix = "wall"

    [shell.launcher.providers.windows]
    prefix = "win"

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    session_position = "center"
    transparency_mode = "glass"

    [shell.screenshot]
    copy_to_clipboard = true
    directory = "/home/indar4ik/Изображения/Screenshots"
    filename_pattern = "%Y%m%d_%H%M%S"
    freeze_screen = true

[theme]
builtin = "Kanagawa"
community_palette = "Kanagawa Kasumi"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "discord", "prismlauncher", "steam", "rofi", "zathura", "hyprtoolkit", "bat", "lazygit", "yazi" ]

[wallpaper]
directory = "~/Изображения/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/indar4ik/Изображения/Wallpapers/21.png"

    [wallpaper.last]
    path = "/home/indar4ik/Изображения/Wallpapers/21.png"

    [wallpaper.monitors.DP-3]
    path = "/home/indar4ik/Изображения/Wallpapers/21.png"

[weather]
address = "Moscow, Russia"

[widget.Spacer]
